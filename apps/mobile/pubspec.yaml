name: dailyhisab
description: DailyHisab - offline-first personal finance app (BDT, minor units).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.3
  intl: ^0.20.2
  uuid: ^4.5.1
  fl_chart: ^0.69.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.21.0

flutter:
  uses-material-design: true

dependency_overrides:
  # The 2.3.1+/2.5.5+ android platform packages switched to JNI-based bindings,
  # which require a ~3 GB Android NDK download to build. Pin the latest pre-JNI
  # versions so the app builds with only the standard Android SDK.
  path_provider_android: 2.2.23
  shared_preferences_android: 2.4.28
