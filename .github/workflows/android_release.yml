name: Android Release AAB + APKs

on:
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Android project exists
        run: |
          if [ ! -d "android" ]; then
            flutter create . --org com.dailyhisab.app --project-name dailyhisab --platforms=android
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build release AAB (for Play Store)
        run: flutter build appbundle --release

      - name: Build release APKs (split per ABI) + size analysis
        run: flutter build apk --release --split-per-abi --analyze-size

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: dailyhisab-release-aab
          path: apps/mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload per-ABI release APKs
        uses: actions/upload-artifact@v4
        with:
          name: dailyhisab-release-apks
          path: apps/mobile/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error