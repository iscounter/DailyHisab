name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android_debug_apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Android project exists
        run: |
          if [ ! -d "android" ]; then
            flutter create . --org com.dailyhisab.app --project-name dailyhisab --platforms=android
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dailyhisab-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
